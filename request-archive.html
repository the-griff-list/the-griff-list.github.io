<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Request Archive - The Grifflist</title><link rel="stylesheet" href="styles.css?v=grifflist-v33"><style>
.archive-wrap{max-width:1100px;margin:0 auto;padding:24px 16px 56px}.archive-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.archive-top img{width:min(180px,45vw)}.archive-top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.archive-top .archive-signout{min-height:36px;padding:8px 12px;font-size:.78rem}.archive-top-actions .button{white-space:nowrap}.archive-panel{background:var(--panel,#141414);border:1px solid var(--line,#333);border-radius:8px;padding:20px;margin:20px 0}.archive-panel h1{font:900 clamp(2rem,6vw,3rem)/1 Impact,'Arial Narrow',sans-serif;text-transform:uppercase;margin:0 0 12px}.archive-panel h1 span{color:var(--hot,#f60)}.archive-status{color:var(--gold,#ffc857);min-height:1.5em}.archive-filters{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.archive-filters input{flex:1;min-width:220px}.archive-table-wrap{overflow-x:auto}.archive-table{width:100%;border-collapse:collapse;min-width:720px}.archive-table th,.archive-table td{text-align:left;padding:12px;border-bottom:1px solid #333;vertical-align:top;line-height:1.45}.archive-table th{color:var(--gold,#ffc857)}.archive-table td{overflow-wrap:anywhere}.archive-login{max-width:460px}.archive-count{color:#ddd}.archive-empty{padding:24px;text-align:center;color:#ccc}[hidden]{display:none!important}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#080808"></head><body><main class="archive-wrap"><div class="archive-top"><a href="admin.html" aria-label="Back to private dashboard"><img src="grifflist-logo.webp" alt="The Grifflist"></a><div class="archive-top-actions"><a class="button button-quiet" href="admin.html">← DASHBOARD</a><button id="archive-logout" class="button button-hot archive-signout" type="button" hidden>SIGN OUT</button></div></div>
<section id="archive-login-panel" class="archive-panel archive-login"><p class="eyebrow">PRIVATE AREA</p><h1>Request <span>Archive</span></h1><p>Sign in with your admin account to view the saved request history.</p><form id="archive-login-form"><label>Email<input id="archive-email" type="email" autocomplete="username" required></label><label>Password<input id="archive-password" type="password" autocomplete="current-password" required></label><button class="button button-hot" type="submit">SIGN IN</button><p id="archive-login-status" class="archive-status" role="status"></p></form></section>
<section id="archive-content" class="archive-panel" hidden><h1>Request <span>Archive</span></h1><div class="archive-filters"><button id="archive-refresh" class="button button-quiet" type="button">REFRESH</button></div><p id="archive-status" class="archive-status" role="status"></p><p id="archive-count" class="archive-count"></p><div class="archive-table-wrap"><table class="archive-table"><thead><tr><th>Date and time requested</th><th>Name</th><th>Song title</th><th>Artist</th><th>Additional instructions</th></tr></thead><tbody id="archive-rows"></tbody></table></div><p id="archive-empty" class="archive-empty" hidden>No archived requests yet.</p></section></main>
